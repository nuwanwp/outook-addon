<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #fff;
      color: #111;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #991b1b;
      color: #fff;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .header h1 { font-size: 14px; font-weight: 700; }
    .header p  { font-size: 11px; opacity: .8; }
    .summary {
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
    }
    .summary.danger { background: #fef2f2; color: #991b1b; }
    .summary.warn   { background: #fffbeb; color: #92400e; }
    .summary.safe   { background: #f0fdf4; color: #166534; }
    .summary.none   { background: #f9fafb; color: #6b7280; }
    .link-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .link-card {
      border-radius: 8px;
      padding: 10px 12px;
      border-left: 4px solid;
    }
    .link-card.danger { background: #fef2f2; border-color: #dc2626; }
    .link-card.warn   { background: #fffbeb; border-color: #d97706; }
    .link-card.safe   { background: #f0fdf4; border-color: #16a34a; }
    .link-card .risk-label {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .link-card.danger .risk-label { color: #dc2626; }
    .link-card.warn   .risk-label { color: #d97706; }
    .link-card.safe   .risk-label { color: #16a34a; }
    .link-card .url {
      font-size: 11px;
      color: #1d4ed8;
      word-break: break-all;
      line-height: 1.4;
      margin-bottom: 4px;
    }
    .link-card .reason {
      font-size: 11px;
      color: #6b7280;
      line-height: 1.4;
    }
    .footer {
      padding: 8px 14px;
      font-size: 10px;
      color: #9ca3af;
      border-top: 1px solid #e5e7eb;
      flex-shrink: 0;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="header">
  <span style="font-size:20px">🛡️</span>
  <div>
    <h1>LinkGuard</h1>
    <p>Scam link protection</p>
  </div>
</div>

<div class="summary none" id="summary">⏳ Scanning email for links…</div>
<div class="link-list" id="link-list"></div>
<div class="footer">Check every link above before clicking anything in the email.</div>

<script>
function analyzeUrl(url) {
  let score = 0;
  const reasons = [];
  try {
    const u = new URL(url);
    const h = u.hostname.toLowerCase();
    if (/^\d{1,3}(\.\d{1,3}){3}$/.test(h))                          { reasons.push('IP address instead of domain'); score += 3; }
    if (['bit.ly','tinyurl.com','t.co','ow.ly','rb.gy'].some(s => h === s)) { reasons.push('URL shortener — hides real destination'); score += 2; }
    if (u.protocol !== 'https:')                                      { reasons.push('Not HTTPS — unencrypted'); score += 2; }
    if (['.xyz','.tk','.ml','.ga','.cf','.top'].some(t => h.endsWith(t))) { reasons.push('High-risk domain extension'); score += 2; }
    const kw = ['login','verify','paypal','password','signin','confirm','account','update','bank','secure'];
    const found = kw.find(k => h.includes(k) || u.pathname.includes(k));
    if (found) { reasons.push('Suspicious keyword: "' + found + '"'); score += 1; }
    if ((h.match(/\./g)||[]).length > 3) { reasons.push('Deep subdomain structure'); score += 1; }
    if (h.split('-').length > 3)         { reasons.push('Many hyphens in domain'); score += 1; }
  } catch(e) { reasons.push('Malformed URL'); score += 5; }
  if (score === 0) reasons.push('No threats detected');
  return { risk: score >= 4 ? 'danger' : score >= 2 ? 'warn' : 'safe', reasons };
}

function riskIcon(r)  { return { danger:'🔴', warn:'🟡', safe:'🟢' }[r]; }
function riskLabel(r) { return { danger:'HIGH RISK — Do not click!', warn:'Suspicious — be careful', safe:'Appears safe' }[r]; }

function scanEmail() {
  const summaryEl = document.getElementById('summary');
  const listEl    = document.getElementById('link-list');

  summaryEl.className = 'summary none';
  summaryEl.textContent = '⏳ Scanning…';
  listEl.innerHTML = '';

  Office.context.mailbox.item.body.getAsync(
    Office.CoercionType.Html,
    function(result) {
      if (result.status !== Office.AsyncResultStatus.Succeeded) {
        summaryEl.textContent = '❌ Could not read email.';
        return;
      }

      const parser  = new DOMParser();
      const doc     = parser.parseFromString(result.value, 'text/html');
      const urls    = [...new Set(
        Array.from(doc.querySelectorAll('a[href^="http"]')).map(a => a.href)
      )];

      if (urls.length === 0) {
        summaryEl.className = 'summary none';
        summaryEl.textContent = '✅ No links in this email.';
        return;
      }

      const results = urls.map(url => ({ url, ...analyzeUrl(url) }));
      const dangers = results.filter(r => r.risk === 'danger').length;
      const warns   = results.filter(r => r.risk === 'warn').length;

      if (dangers > 0) {
        summaryEl.className = 'summary danger';
        summaryEl.textContent = '🚨 ' + dangers + ' HIGH RISK link' + (dangers > 1 ? 's' : '') + ' — do NOT click!';
      } else if (warns > 0) {
        summaryEl.className = 'summary warn';
        summaryEl.textContent = '⚠️ ' + warns + ' suspicious link' + (warns > 1 ? 's' : '') + ' — be careful';
      } else {
        summaryEl.className = 'summary safe';
        summaryEl.textContent = '✅ ' + urls.length + ' link' + (urls.length > 1 ? 's' : '') + ' scanned — all appear safe';
      }

      results.forEach(function(r) {
        const card = document.createElement('div');
        card.className = 'link-card ' + r.risk;
        card.innerHTML =
          '<div class="risk-label">' + riskIcon(r.risk) + ' ' + riskLabel(r.risk) + '</div>' +
          '<div class="url">' + r.url + '</div>' +
          '<div class="reason">' + r.reasons.join(' · ') + '</div>';
        listEl.appendChild(card);
      });
    }
  );
}

Office.onReady(function() {
  // Scan the current email immediately
  scanEmail();

  // Re-scan automatically whenever user selects a different email
  if (Office.context.mailbox.addHandlerAsync) {
    Office.context.mailbox.addHandlerAsync(
      Office.EventType.ItemChanged,
      function() { scanEmail(); }
    );
  }
});
</script>
</body>
</html>
