<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #fff;
      color: #111;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: #991b1b;
      color: #fff;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .header h1 { font-size: 14px; font-weight: 700; }
    .header p  { font-size: 11px; opacity: .8; }

    /* Summary bar */
    .summary {
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
    }
    .summary.danger { background: #fef2f2; color: #991b1b; }
    .summary.warn   { background: #fffbeb; color: #92400e; }
    .summary.safe   { background: #f0fdf4; color: #166534; }
    .summary.none   { background: #f9fafb; color: #6b7280; }

    /* Link list */
    .link-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .link-card {
      border-radius: 8px;
      padding: 10px 12px;
      border-left: 4px solid;
    }
    .link-card.danger { background: #fef2f2; border-color: #dc2626; }
    .link-card.warn   { background: #fffbeb; border-color: #d97706; }
    .link-card.safe   { background: #f0fdf4; border-color: #16a34a; }

    .link-card .risk-label {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .link-card.danger .risk-label { color: #dc2626; }
    .link-card.warn   .risk-label { color: #d97706; }
    .link-card.safe   .risk-label { color: #16a34a; }

    .link-card .url {
      font-size: 11px;
      color: #1d4ed8;
      word-break: break-all;
      line-height: 1.4;
      margin-bottom: 4px;
    }
    .link-card .reason {
      font-size: 11px;
      color: #6b7280;
      line-height: 1.4;
    }

    /* Footer */
    .footer {
      padding: 8px 14px;
      font-size: 10px;
      color: #9ca3af;
      border-top: 1px solid #e5e7eb;
      flex-shrink: 0;
      text-align: center;
    }

    /* Loading */
    .loading {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

<div class="header">
  <span style="font-size:20px">🛡️</span>
  <div>
    <h1>LinkGuard</h1>
    <p>Scam link protection</p>
  </div>
</div>

<div class="summary none" id="summary">⏳ Scanning email for links…</div>
<div class="link-list" id="link-list">
  <div class="loading">Scanning…</div>
</div>
<div class="footer">Hover over any link URL above to see the full address before clicking it in the email.</div>

<script>
function analyzeUrl(url) {
  let score = 0;
  const reasons = [];
  try {
    const u = new URL(url);
    const h = u.hostname.toLowerCase();

    if (/^\d{1,3}(\.\d{1,3}){3}$/.test(h)) {
      reasons.push('IP address used instead of a real domain');
      score += 3;
    }
    const shorteners = ['bit.ly','tinyurl.com','t.co','ow.ly','rb.gy','is.gd','buff.ly'];
    if (shorteners.some(s => h === s || h.endsWith('.' + s))) {
      reasons.push('URL shortener — hides the real destination');
      score += 2;
    }
    if (u.protocol !== 'https:') {
      reasons.push('Not HTTPS — connection is unencrypted');
      score += 2;
    }
    const badTlds = ['.xyz','.tk','.ml','.ga','.cf','.top','.club','.online'];
    if (badTlds.some(t => h.endsWith(t))) {
      reasons.push('High-risk domain extension (' + h.split('.').pop() + ')');
      score += 2;
    }
    const keywords = ['login','verify','secure','paypal','password','signin','confirm','account','update','bank'];
    const found = keywords.find(k => h.includes(k) || u.pathname.includes(k));
    if (found) {
      reasons.push('Suspicious keyword in URL: "' + found + '"');
      score += 1;
    }
    if ((h.match(/\./g) || []).length > 3) {
      reasons.push('Unusually deep subdomain — common in phishing');
      score += 1;
    }
    if (h.split('-').length > 3) {
      reasons.push('Many hyphens in domain name');
      score += 1;
    }
  } catch(e) {
    reasons.push('Malformed or unreadable URL');
    score += 5;
  }

  if (score === 0) reasons.push('No obvious threats detected');

  const risk = score >= 4 ? 'danger' : score >= 2 ? 'warn' : 'safe';
  return { risk, reasons };
}

function riskIcon(risk)  { return { danger:'🔴', warn:'🟡', safe:'🟢' }[risk]; }
function riskLabel(risk) { return { danger:'HIGH RISK — Do not click!', warn:'Suspicious — be careful', safe:'Appears safe' }[risk]; }

Office.onReady(function() {
  Office.context.mailbox.item.body.getAsync(
    Office.CoercionType.Html,
    function(result) {
      const listEl    = document.getElementById('link-list');
      const summaryEl = document.getElementById('summary');

      if (result.status !== Office.AsyncResultStatus.Succeeded) {
        summaryEl.textContent = '❌ Could not read email.';
        listEl.innerHTML = '';
        return;
      }

      const parser = new DOMParser();
      const doc    = parser.parseFromString(result.value, 'text/html');
      const anchors = Array.from(doc.querySelectorAll('a[href^="http"]'));
      const urls   = [...new Set(anchors.map(a => a.href))];

      listEl.innerHTML = '';

      if (urls.length === 0) {
        summaryEl.className = 'summary none';
        summaryEl.textContent = '✅ No links found in this email.';
        return;
      }

      // Analyse all links
      const results = urls.map(url => ({ url, ...analyzeUrl(url) }));
      const dangers = results.filter(r => r.risk === 'danger').length;
      const warns   = results.filter(r => r.risk === 'warn').length;

      // Summary bar
      if (dangers > 0) {
        summaryEl.className = 'summary danger';
        summaryEl.textContent = '🚨 ' + dangers + ' HIGH RISK link' + (dangers > 1 ? 's' : '') + ' found — do NOT click!';
      } else if (warns > 0) {
        summaryEl.className = 'summary warn';
        summaryEl.textContent = '⚠️ ' + warns + ' suspicious link' + (warns > 1 ? 's' : '') + ' — proceed carefully';
      } else {
        summaryEl.className = 'summary safe';
        summaryEl.textContent = '✅ ' + urls.length + ' link' + (urls.length > 1 ? 's' : '') + ' scanned — all appear safe';
      }

      // Render each link card
      results.forEach(function(r) {
        const card = document.createElement('div');
        card.className = 'link-card ' + r.risk;
        card.innerHTML =
          '<div class="risk-label">' + riskIcon(r.risk) + ' ' + riskLabel(r.risk) + '</div>' +
          '<div class="url">' + r.url + '</div>' +
          '<div class="reason">' + r.reasons.join(' · ') + '</div>';
        listEl.appendChild(card);
      });
    }
  );
});
</script>
</body>
</html>
