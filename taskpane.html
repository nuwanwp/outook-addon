<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body style="margin:0;padding:6px 12px;font-family:'Segoe UI',sans-serif;font-size:12px;background:#fff3f3;border-top:3px solid #dc2626;">
<div id="msg" style="color:#991b1b;font-weight:700;">🛡️ LinkGuard — loading...</div>
<div id="log" style="color:#555;font-size:11px;margin-top:4px;"></div>

<script>
function log(msg) {
  document.getElementById('log').innerHTML += msg + '<br/>';
}

log('Script started');

Office.onReady(function(info) {
  log('Office.onReady fired — host: ' + info.host + ', platform: ' + info.platform);

  if (!Office.context.mailbox) {
    log('ERROR: mailbox not available');
    document.getElementById('msg').textContent = '🛡️ LinkGuard — mailbox unavailable';
    return;
  }

  log('Mailbox OK — getting email body...');
  document.getElementById('msg').textContent = '🛡️ LinkGuard — scanning...';

  Office.context.mailbox.item.body.getAsync(
    Office.CoercionType.Html,
    function(result) {
      if (result.status !== Office.AsyncResultStatus.Succeeded) {
        log('ERROR getting body: ' + result.error.message);
        document.getElementById('msg').textContent = '🛡️ LinkGuard — failed to read email';
        return;
      }

      log('Got email body — length: ' + result.value.length);

      const matches = result.value.match(/<a\s[^>]*href=["']https?:\/\/[^"']*["'][^>]*>[\s\S]*?<\/a>/gi);
      const count = matches ? matches.length : 0;
      log('Links found: ' + count);

      if (count === 0) {
        document.getElementById('msg').textContent = '🛡️ LinkGuard — no links in this email';
        return;
      }

      const styleBlock = `<style>
        .lg-wrap { display:inline; position:relative; }
        .lg-tip {
          display:none; position:absolute;
          bottom:calc(100% + 8px); left:0;
          background:#991b1b; color:#fff;
          font-size:12px; font-weight:700;
          font-family:'Segoe UI',sans-serif;
          padding:6px 12px; border-radius:6px;
          white-space:nowrap; z-index:99999;
          pointer-events:none;
          box-shadow:0 4px 14px rgba(0,0,0,0.25);
        }
        .lg-tip::after {
          content:''; position:absolute;
          top:100%; left:12px;
          border:5px solid transparent;
          border-top-color:#991b1b;
        }
        .lg-wrap:hover .lg-tip,
        .lg-wrap:focus-within .lg-tip { display:block; }
        .lg-wrap a:focus { outline:2px solid #dc2626; outline-offset:2px; border-radius:2px; }
      </style>`;

      let html = result.value;
      html = html.includes('</head>')
        ? html.replace('</head>', styleBlock + '</head>')
        : styleBlock + html;

      html = html.replace(
        /(<a\s[^>]*href=["']https?:\/\/[^"']*["'][^>]*>)([\s\S]*?)(<\/a>)/gi,
        '<span class="lg-wrap">$1$2$3<span class="lg-tip">⚠️ Do NOT click — verify with IT first!</span></span>'
      );

      log('Injecting into email body...');

      Office.context.mailbox.item.body.setAsync(
        html,
        { coercionType: Office.CoercionType.Html },
        function(setResult) {
          if (setResult.status === Office.AsyncResultStatus.Succeeded) {
            log('Injection successful!');
            document.getElementById('msg').textContent =
              '🛡️ LinkGuard — ⚠️ ' + count + ' link' + (count > 1 ? 's' : '') + ' protected. Hover before clicking!';
          } else {
            log('ERROR setting body: ' + setResult.error.message);
            document.getElementById('msg').textContent = '🛡️ LinkGuard — injection failed';
          }
        }
      );
    }
  );
});
</script>
</body>
</html>
